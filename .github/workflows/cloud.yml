name: Deploy Cloud

# Manually deploy the official OpenDesigner Cloud Worker from main.
# The cloudflare-deploy GitHub environment supplies deployment secrets.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment
        type: choice
        options: [staging]

concurrency:
  group: cloud-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-deploy
    permissions:
      contents: read
      deployments: write
    env:
      DEPLOYMENT: packages/cloud/deploy/opendesigner/${{ inputs.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      # Resolve or create the account's workers.dev subdomain before building the editor.
      - name: Create the Cloud URL
        id: cloud_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDEFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          response_file=$(mktemp)
          status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")

          if [ "$status" = "200" ] && jq -e '.success == true and (.result.subdomain | type == "string" and length > 0)' "$response_file" >/dev/null; then
            subdomain=$(jq -r '.result.subdomain' "$response_file")
          elif [ "$status" = "404" ]; then
            payload=$(jq -n --arg subdomain "opendesigner-vsn" '{subdomain: $subdomain}')
            status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request PUT --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' --data "$payload" "$api")
            if [ "$status" != "200" ] || ! jq -e '.success == true and (.result.subdomain | type == "string" and length > 0)' "$response_file" >/dev/null; then
              echo "::error::Could not create the Cloudflare workers.dev subdomain. The token needs Workers Scripts: Edit permission."
              jq -c '{errors: .errors}' "$response_file" >&2 || true
              exit 1
            fi
            subdomain=$(jq -r '.result.subdomain' "$response_file")
          else
            echo "::error::Could not read the Cloudflare workers.dev subdomain (HTTP $status)."
            jq -c '{errors: .errors}' "$response_file" >&2 || true
            exit 1
          fi

          worker_name=$(sed -n 's/^[[:space:]]*"name":[[:space:]]*"\([^"]*\)".*/\1/p' "$DEPLOYMENT/wrangler.jsonc" | head -n 1)
          if [ -z "$worker_name" ]; then
            echo "::error::Could not read the Worker name from wrangler.jsonc."
            exit 1
          fi
          cloud_url="https://$worker_name.$subdomain.workers.dev"
          echo "cloud_url=$cloud_url" >> "$GITHUB_OUTPUT"
          echo "CLOUD_URL=$cloud_url" >> "$GITHUB_ENV"

          python3 - "$DEPLOYMENT/opendesigner-cloud.toml" "$cloud_url" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          url = sys.argv[2]
          text = path.read_text()
          updated, count = re.subn(r'(?m)^public_url\s*=\s*".*"$',
                                   f'public_url = "{url}"', text, count=1)
          if count != 1:
              raise SystemExit("Could not update public_url in the deployment config.")
          path.write_text(updated)
          PY

      # The editor's demo document draws its shader fills at build time in a headless Chromium.
      - uses: ./.github/actions/setup-playwright

      - name: Build the Cloud site
        env:
          VITE_OPENDESIGNER_OFFICIAL_CLOUD_URL: ${{ steps.cloud_url.outputs.cloud_url }}
          VITE_OPENDESIGNER_FEEDBACK: "on"
        run: bun run build:packages && bun run build:cloud

      # Migrations run before the new code, directly against the database.
      - name: Migrate the database
        env:
          OPENDESIGNER_CLOUD_CONFIG: ${{ github.workspace }}/${{ env.DEPLOYMENT }}/opendesigner-cloud.toml
          TURSO_URL: ${{ secrets.TURSO_URL || vars.TURSO_URL || secrets.DATABASE_URL || vars.DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: bun --filter @open-designer/cloud migrate:turso

      - name: Collect the Worker's secrets
        env:
          TURSO_URL: ${{ secrets.TURSO_URL || vars.TURSO_URL || secrets.DATABASE_URL || vars.DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          jq -n '{TURSO_URL: env.TURSO_URL, TURSO_AUTH_TOKEN: env.TURSO_AUTH_TOKEN,
            BETTER_AUTH_SECRET: env.BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID: env.GOOGLE_CLIENT_ID,
            GOOGLE_CLIENT_SECRET: env.GOOGLE_CLIENT_SECRET, S3_ACCESS_KEY_ID: env.S3_ACCESS_KEY_ID,
            S3_SECRET_ACCESS_KEY: env.S3_SECRET_ACCESS_KEY}' > "$RUNNER_TEMP/cloud-secrets.json"

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDEFLARE_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.DEPLOYMENT }}
          packageManager: bun
          command: >-
            deploy --assets ${{ github.workspace }}/dist-cloud
            --secrets-file ${{ runner.temp }}/cloud-secrets.json

      - name: Check the deployment
        env:
          CLOUD_URL: ${{ steps.cloud_url.outputs.cloud_url }}
        run: |
          for path in /health /ready /.well-known/opendesigner / /welcome /auth/sign-in; do
            accept='application/json'
            case "$path" in /|/welcome|/auth/*) accept='text/html' ;; esac
            status=$(curl --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 \
              --header "Accept: $accept" \
              --output /dev/null --write-out '%{http_code}' "$CLOUD_URL$path")
            if [ "$status" != 200 ]; then
              echo "::error::$path answered HTTP $status"
              exit 1
            fi
          done
          echo "Cloud URL: $CLOUD_URL" >> "$GITHUB_STEP_SUMMARY"
