name: Chromium build

# OpenPencil Chromium: the desktop app on Tauri v3 with the CEF runtime,
# built by hand from a branch that carries it (desktop/tauri.chromium.conf.json).
# Each run replaces the `chromium` prerelease, whose latest.json is that
# flavor's update feed; stable releases and their feed are untouched.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit with the Chromium flavor.
        required: true
        default: build/tauri-v3
        type: string

permissions:
  contents: read

concurrency:
  group: chromium-build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.version.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # A pre-release of the next version: 0.16.0 builds as 0.17.0-chromium.N,
      # 0.17.0-beta.2 as 0.17.0-chromium.N.
      - id: version
        name: Version the build as a pre-release of the next version
        run: |
          base=$(jq -r .version desktop/tauri.conf.json)
          core=${base%%-*}
          if [ "$core" = "$base" ]; then
            IFS=. read -r major minor _ <<< "$core"
            core="$major.$((minor + 1)).0"
          fi
          echo "version=$core-chromium.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  native:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: chromium-${{ matrix.target }}
      - uses: ./.github/actions/setup-bun
        with:
          cache-scope: desktop
          cache-save: 'false'
      - name: Build, sign, and notarize
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          jq -n --arg version "$VERSION" '{version: $version}' > chromium-version.json
          node node_modules/@tauri-apps/cli/tauri.js build --target "$TARGET" --features cef \
            --config desktop/tauri.chromium.conf.json --config chromium-version.json --verbose
      # Both legs name their bundles the same, so each puts the architecture
      # into its file names before the publish job puts them on one release.
      - name: Collect the installer and the updater bundle
        env:
          BUNDLE: desktop/target/${{ matrix.target }}/release/bundle
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir out
          name="OpenPencil-Chromium_${VERSION}_$ARCH"
          cp "$BUNDLE"/dmg/*.dmg "out/$name.dmg"
          cp "$BUNDLE"/macos/*.app.tar.gz "out/$name.app.tar.gz"
          cp "$BUNDLE"/macos/*.app.tar.gz.sig "out/$name.app.tar.gz.sig"
      - uses: actions/upload-artifact@v7
        with:
          name: chromium-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          compression-level: 0

  # Runs only after both legs succeed, so a failed build leaves the previous
  # release and its feed in place, and latest.json is written once.
  publish:
    needs: [plan, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      SOURCE: ${{ needs.plan.outputs.source }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: chromium-*
          path: out
          merge-multiple: true
      - name: Write the update feed
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/chromium"
          entry() {
            local file="OpenPencil-Chromium_${VERSION}_$1.app.tar.gz"
            jq -n --arg url "$base/$file" --rawfile signature "out/$file.sig" \
              '{url: $url, signature: ($signature | rtrimstr("\n"))}'
          }
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson arm "$(entry aarch64)" --argjson intel "$(entry x86_64)" \
            '{version: $version, pub_date: $date,
              platforms: {"darwin-aarch64": $arm, "darwin-x86_64": $intel}}' > out/latest.json
      - name: Replace the chromium prerelease
        run: |
          gh release delete chromium --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create chromium out/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE" \
            --prerelease --latest=false --title "OpenPencil Chromium $VERSION" \
            --notes "OpenPencil on Tauri v3 with the Chromium (CEF) runtime, from $SOURCE. It installs beside OpenPencil and updates only from this release."
